<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>非常用電源</title>
  <link rel="stylesheet" href="./controller.css">
  <script type="module" src="./assets.js"></script>
</head>
<body data-kind="battery">
  <h1>非常用電源</h1>
  <p id="demoNotice" class="demo-notice" hidden>デモ・架空データです。実在設備や利用可否を示しません。</p>
  <div class="legend"><span><i class="dot available"></i>使用可能</span><span><i class="dot partial"></i>使用中</span><span><i class="dot unavailable"></i>利用不可</span><span><i class="dot unknown"></i>不明</span></div>
  <button id="reloadButton" type="button">データを再取得</button>
  <div id="statusMessage" class="status" role="status" aria-live="polite">読み込み待ち</div>
  <p>表示 <strong id="visibleCount">-</strong>件 ／ 登録 <strong id="totalCount">-</strong>件</p>
  <p>データ更新: <span id="updatedAt">-</span></p>
  <p class="notice">登録済みの設備のみ表示します。値は最終確認時点のもので、リアルタイムの稼働保証ではありません。個別の確認日時を詳細画面で確認してください。</p>
</body>
</html>
