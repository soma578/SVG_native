<!DOCTYPE html>
<html lang="ja">
<title>SVGMapLevel0.1 Demo</title>
<meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0">
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<!-- 本家 svgmap/svgMapDemo のレイヤーリストUI -->
<link href="/layerListStyle.css" rel="stylesheet" type="text/css">

<!-- 本家デモと同じGIS・SVGMap API構成。SVGMap本体だけローカル資産を読む。 -->
<script type="text/javascript" src="https://unpkg.com/jsts@1.6.1/dist/jsts.min.js"></script>
<script type="module" src="/svgmap-bootstrap.js"></script>
<script src="/customShowPoiProperty.js" defer></script>

<body bgcolor="#ffffff" style="overflow:hidden;">
  <div id="mapcanvas" data-src="/svgmapAppLayers/Container.svg"></div>
  <div id="gui">
    <img id="zoomupButton" style="left:5px;top:5px;position:absolute;" src="https://raw.githubusercontent.com/svgmap/svgMapDemo/main/img/zoomup.png" onclick="svgMap.zoomup()" width="20" height="20" alt="拡大" title="拡大">
    <img id="zoomdownButton" style="left:5px;top:25px;position:absolute;" src="https://raw.githubusercontent.com/svgmap/svgMapDemo/main/img/zoomdown.png" onclick="svgMap.zoomdown()" width="20" height="20" alt="縮小" title="縮小">
    <img id="gpsButton" style="left:5px;top:45px;position:absolute;" src="https://raw.githubusercontent.com/svgmap/svgMapDemo/main/img/gps.png" onclick="svgMap.gps()" width="20" height="20" alt="現在地" title="現在地">

    <span style="right:23px;top:2px;position:absolute;font-size:14px;color:blue"><a href="https://svgmap.org/" target="_blank" rel="noopener noreferrer">SVGMap</a>Level0.1 technical preview</span>
    <img id="copyPermaLink" style="right:3px;top:3px;position:absolute;width:15px;height:15px;cursor:pointer;" onclick="svgMap.getBasicPermanentLink(true)" src="https://raw.githubusercontent.com/svgmap/svgMapDemo/main/img/permaLink.png" alt="パーマリンク" title="パーマリンクをクリップボードにコピーする">

    <img id="centerSight" style="opacity:0.5" src="https://raw.githubusercontent.com/svgmap/svgMapDemo/main/img/Xcursor.png" width="15" height="15" alt="地図中心">
    <table style="right:3px;top:20px;position:absolute;font-size:12px;color:brown">
      <tbody><tr><td>Lat,Lng:</td><td id="centerPos"></td></tr></tbody>
    </table>

    <font id="vScale" size="-2" color="brown" style="left:5px;bottom:37px;position:absolute;"></font>
    <span id="globalMessage" style="left:30px;top:3px;position:absolute;font-size:12px;"></span>

    <font id="noticeText" size="-2" color="black" style="left:3px;bottom:3px;position:absolute;background-color:rgba(0,200,200,0.5)">Notice: This page is provided solely for technical preview of <a href="https://svgmap.org/" target="_blank" rel="noopener noreferrer">SVGMap</a> technology. The originator of this page assumes no responsibility for any damages resulting from the use of the information on each layer displayed.</font>

    <img id="vscaleImg" style="left:5px;bottom:20px;position:absolute;" src="https://raw.githubusercontent.com/svgmap/svgMapDemo/main/img/vscale.png" alt="縮尺">

    <div id="layerList"
         data-hiddenfilter
         data-layerstylecontroller
         data-customizer="/svgmapjs/SVGMapCustomLayersManager_r3module.html"
         style="left:30px;top:10px;width:300px;height:90%;position:absolute;"></div>

    <div id="layerSpecificUI" style="right:10px;top:40px;width:400px;height:400px;position:absolute;background-color:white;opacity:0.8;display:none;"></div>
  </div>
</body>
</html>
