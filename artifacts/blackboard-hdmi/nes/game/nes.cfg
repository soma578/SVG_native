# NROM-128: 16 KB PRG at $C000, 8 KB CHR, C stack at the top of RAM.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    PRG:    start = $C000, size = $3FFA, file = %O, fill = yes, define = yes;
    VEC:    start = $FFFA, size = $0006, file = %O, fill = yes;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes;
    OAMRAM: start = $0200, size = $0100;
    RAM:    start = $0300, size = $0500, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    HEADER:   load = HEADER, type = ro;
    STARTUP:  load = PRG,    type = ro, define = yes;
    ONCE:     load = PRG,    type = ro, optional = yes;
    CODE:     load = PRG,    type = ro, define = yes;
    RODATA:   load = PRG,    type = ro, define = yes;
    DATA:     load = PRG, run = RAM, type = rw, define = yes;
    VECTORS:  load = VEC,    type = ro;
    CHARS:    load = CHR,    type = ro;
    BSS:      load = RAM,    type = bss, define = yes;
    OAM:      load = OAMRAM, type = bss;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
