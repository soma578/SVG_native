<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MOSAdemy 設備監視</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 9px; color: #1f2937; font-size: 13px; line-height: 1.5; }
    h1 { margin: 0 0 6px; font-size: 17px; }
    p { margin: 6px 0; }
    button { padding: 6px 10px; border: 1px solid #a5b4c4; border-radius: 6px; background: #fff; color: #24364b; cursor: pointer; font: inherit; }
    button:disabled { cursor: wait; opacity: .6; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 8px 0; }
    .legend span { white-space: nowrap; }
    .dot { display: inline-block; width: 11px; height: 11px; margin-right: 4px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #94a3b8; vertical-align: -2px; }
    .available { background: #15803d; } .partial { background: #a16207; }
    .unavailable { background: #b91c1c; } .unknown { background: #475569; }
    .status { margin: 8px 0; padding: 7px 9px; border-left: 4px solid #15803d; background: #f0fdf4; }
    .status.error { border-color: #b91c1c; background: #fef2f2; color: #7f1d1d; }
    .notice { padding: 7px 9px; border-left: 3px solid #64748b; background: #f8fafc; font-size: 11px; }
  </style>
  <script type="module" src="./mosademy.js"></script>
</head>
<body>
  <h1>MOSAdemy 設備監視</h1>
  <div class="legend" aria-label="データ状態の凡例">
    <span><i class="dot available"></i>正常</span>
    <span><i class="dot partial"></i>要確認</span>
    <span><i class="dot unavailable"></i>異常・オフライン</span>
    <span><i class="dot unknown"></i>古い情報・未取得</span>
  </div>
  <button id="reloadButton" type="button">公開データを再取得</button>
  <div id="statusMessage" class="status" role="status" aria-live="polite">読み込み待ち</div>
  <p>表示施設: <strong id="facilityCount">-</strong>件</p>
  <p>最新計測: <span id="measuredAt">-</span></p>
  <p>最終取得: <span id="fetchedAt">-</span></p>
  <p class="notice">公開承認済みデータを約3分ごとに確認します。配信側のキャッシュにより値はさらに遅れる場合があります。燃料残量はL、水位残量は設備内の残量%、電力はWであり、電池残量や浸水深ではありません。</p>
</body>
</html>
