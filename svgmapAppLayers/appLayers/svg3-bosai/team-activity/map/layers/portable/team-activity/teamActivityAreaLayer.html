<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Team Activity Area Portable Layer</title>
  <!-- layerWebAppReady を発行するのはこのライブラリ。読み込まないと start() が
       一度も走らず、レイヤーが黙って何も描かない（ピン側は読み込んでいた）。 -->
  <script src="../svgmap-slawa-client/svgMapLayerLib.js"></script>
</head>
<body>
<script type="module">
import { initTeamActivityAreaLayer } from './teamActivityAreaCore.js';
window.hiddenOnLayerLoad = () => {};
window.addEventListener('layerWebAppReady', initTeamActivityAreaLayer, { once: true });
const bootWhenReady = (attempt = 0) => {
  if (window.svgMap && window.svgImage) initTeamActivityAreaLayer();
  else if (attempt < 100) setTimeout(() => bootWhenReady(attempt + 1), 50);
};
queueMicrotask(bootWhenReady);
</script>
</body>
</html>
