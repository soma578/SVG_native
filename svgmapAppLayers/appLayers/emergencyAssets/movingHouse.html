<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ムービングハウス</title>
  <link rel="stylesheet" href="./controller.css">
  <script src="/svgmapjs/svgMapLayerLib.js"></script>
  <script type="module" src="./assets.js"></script>
</head>
<body data-kind="movingHouse">
  <h1>ムービングハウス</h1>
  <p id="demoNotice" class="demo-notice" hidden>デモ・架空データです。実在住宅や入居受付を示しません。</p>
  <div class="legend"><span><i class="dot available"></i>入居可能</span><span><i class="dot partial"></i>入居中・空きなし</span><span><i class="dot unavailable"></i>利用不可</span><span><i class="dot unknown"></i>不明</span></div>
  <button id="reloadButton" type="button">データを再取得</button>
  <div id="statusMessage" class="status" role="status" aria-live="polite">読み込み待ち</div>
  <p>表示 <strong id="visibleCount">-</strong>件 ／ 登録 <strong id="totalCount">-</strong>件</p>
  <p>データ更新: <span id="updatedAt">-</span></p>
  <p class="notice">設置済みでも入居可能とは限りません。受付可否は登録情報の最終確認時点のものです。入居者の個人情報は扱いません。</p>
</body>
</html>
